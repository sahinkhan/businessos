name: BusinessOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-typing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install constrained typing environment
        run: |
          python -m pip install --constraint requirements/constraints-py313.txt -e ".[dev,providers]"
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/tenant
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/identity
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/organization
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/currency
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/geography
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/reference_data
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/uom
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/party
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/policy
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/audit
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/data_governance
          python -m pip install --constraint requirements/constraints-py313.txt -e examples/proof_module
      - name: Native Windows mypy
        run: mypy platform/src foundations tests examples/proof_module/src

  python-quality:
    runs-on: ubuntu-latest
    env:
      BOS_TEST_DATABASE_ADMIN_URL: postgresql://businessos_admin:businessos-administration@localhost:5432/postgres
      BOS_TEST_DATABASE_MIGRATION_URL: postgresql://businessos_migrator:businessos-migration@localhost:5432/postgres
      BOS_TEST_DATABASE_RUNTIME_URL: postgresql://businessos_app:businessos-application@localhost:5432/postgres
      BOS_TEST_DATABASE_OPERATIONS_URL: postgresql://businessos_ops:businessos-operations@localhost:5432/postgres
      BOS_TEST_REDIS_URL: redis://localhost:6379/0
      BOS_TEST_NATS_URL: nats://localhost:4222
      BOS_TEST_S3_ENDPOINT: http://localhost:9000
      BOS_TEST_S3_ACCESS_KEY: businessos
      BOS_TEST_S3_SECRET_KEY: businessos-development
      BOS_MIGRATOR_PASSWORD: businessos-migration
      BOS_APPLICATION_PASSWORD: businessos-application
      BOS_OPERATIONS_PASSWORD: businessos-operations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Phase 0 architecture governance gate
        run: python scripts/check_phase0_architecture.py

      - name: Build pinned MinIO test image
        run: docker compose build object-storage

      - name: Start pinned infrastructure
        run: docker compose up --detach --wait postgres redis nats object-storage

      - name: Verify exact MinIO release and readiness
        run: |
          docker compose exec -T object-storage /usr/local/bin/minio --version | grep -F RELEASE.2025-09-07T16-13-09Z
          curl --fail --silent --show-error --retry 20 --retry-delay 2 http://localhost:9000/minio/health/ready

      - name: Install constrained framework and proof module
        run: |
          python -m pip install --constraint requirements/constraints-py313.txt -e '.[dev,providers]'
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/tenant
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/identity
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/organization
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/currency
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/geography
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/reference_data
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/uom
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/party
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/policy
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/audit
          python -m pip install --constraint requirements/constraints-py313.txt -e foundations/data_governance
          python -m pip install --constraint requirements/constraints-py313.txt -e examples/proof_module

      - name: Ruff formatting
        run: ruff format --check platform/src foundations examples tests

      - name: Ruff linting
        run: ruff check platform/src foundations examples tests

      - name: Static typing
        run: |
          mypy platform/src foundations tests examples/proof_module/src
          pyright platform/src foundations examples/proof_module/src

      - name: S3 provider smoke
        run: pytest -q tests/integration/test_infrastructure_providers.py -k s3

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Whole-suite collection
        run: pytest --collect-only -q tests

      - name: PostgreSQL and provider integration tests
        run: pytest -q tests/integration

      - name: External module conformance
        run: pytest -q tests/conformance

      - name: Installed wheel migration smoke
        run: sh scripts/validate_wheels.sh

      - name: Development and production images
        run: |
          docker build --target development --tag businessos-ci-development .
          docker build --target production --tag businessos-ci-production .
          docker build --target migration-smoke --tag businessos-ci-migration-smoke .

      - name: Production-derived image migration upgrade and replay
        run: |
          python scripts/migration_database_smoke.py \
            --image businessos-ci-migration-smoke \
            --docker-network host \
            --container-host 127.0.0.1

      - name: Committed patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

      - name: Stop infrastructure
        if: always()
        run: docker compose down --volumes

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: TypeScript static typing
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Prettier formatting check
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Automated accessibility tests
        run: npm run test:a11y
      - name: Production build
        run: npm run build
      - name: Bundle size budget check
        run: npm run bundle:check
