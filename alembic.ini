[alembic]
script_location = platform/src/businessos/migration_assets
prepend_sys_path = platform/src
path_separator = os
version_locations = platform/src/businessos/migration_assets/versions
sqlalchemy.url = postgresql+psycopg://businessos_migrator:businessos-migration@localhost:5432/businessos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
