services:
  app:
    build:
      context: .
      target: development
    environment:
      BOS_DATABASE_URL: postgresql+psycopg://businessos:businessos@postgres:5432/businessos
      BOS_ENVIRONMENT: development
      BOS_LOG_LEVEL: INFO
    volumes:
      - .:/app
    ports:
      - "${BOS_APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: businessos
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: businessos
    ports:
      - "${BOS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos -d businessos"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - businessos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BOS_REDIS_PORT:-6379}:6379"

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "${BOS_NATS_PORT:-4222}:4222"
      - "${BOS_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - businessos-nats:/data

  object-storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: businessos
      MINIO_ROOT_PASSWORD: businessos-development
    ports:
      - "${BOS_S3_PORT:-9000}:9000"
      - "${BOS_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - businessos-objects:/data

volumes:
  businessos-postgres:
  businessos-nats:
  businessos-objects:
