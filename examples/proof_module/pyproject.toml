[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "businessos-phase1-proof"
version = "2.0.0"
description = "External BusinessOS Phase 1 architecture proof module"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "businessos>=0.1,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
]

[project.entry-points."businessos.modules"]
phase1-proof = "businessos_proof:ProofModule"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
businessos_proof = ["manifest.json", "migrations/versions/*.py", "py.typed"]
