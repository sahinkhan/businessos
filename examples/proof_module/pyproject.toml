[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "businessos-phase1-proof"
version = "2.0.0"
description = "External BusinessOS Phase 1 architecture proof module"
requires-python = ">=3.13"
dependencies = ["businessos>=0.1,<1"]

[project.entry-points."businessos.modules"]
phase1-proof = "businessos_proof:ProofModule"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
businessos_proof = ["manifest.json", "migrations/versions/*.py", "py.typed"]
