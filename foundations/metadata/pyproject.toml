[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "businessos-foundation-metadata"
version = "0.1.0"
description = "Versioned Metadata definition and publication foundation"
requires-python = ">=3.13"
dependencies = [
  "businessos>=0.1,<1",
  "businessos-foundation-tenant>=0.2,<1",
  "businessos-foundation-identity>=0.2,<1",
  "businessos-foundation-policy>=0.4,<1",
  "businessos-foundation-audit>=0.4,<1",
  "businessos-foundation-data-governance>=0.4,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
]

[project.entry-points."businessos.modules"]
foundation-metadata = "businessos_metadata:MetadataModule"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
businessos_metadata = ["manifest.json", "migrations/versions/*.py", "py.typed"]
