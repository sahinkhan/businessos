[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "businessos-foundation-policy"
version = "0.5.0"
description = "BusinessOS authorization, roles, ABAC, and policy foundation module"
requires-python = ">=3.13"
dependencies = [
  "businessos>=0.1,<1",
  "businessos-foundation-tenant>=0.2,<1",
  "businessos-foundation-identity>=0.3,<1",
  "businessos-foundation-organization>=0.3,<1",
  "businessos-foundation-party>=0.3,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
]

[project.entry-points."businessos.modules"]
foundation-policy = "businessos_policy:PolicyModule"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
businessos_policy = ["manifest.json", "migrations/versions/*.py", "py.typed"]
